<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef3f0">
  <title>SafeCircle — Connection paused</title>

    main{max-width:390px;background:var(--paper);padding:32px 24px;border-radius:28px}svg{width:48px;height:48px;color:var(--forest)}h1{font-size:32px;font-weight:600;letter-spacing:-.04em;line-height:1.1;margin:24px 0 16px}p{font-size:16px;line-height:1.5;color:var(--forest)}button{margin-top:16px;width:100%;min-height:56px;border:0;border-radius:16px;background:var(--mint);color:var(--carbon);font:600 16px system-ui;cursor:pointer}button:focus-visible{outline:3px solid var(--forest);outline-offset:4px}small{display:block;margin-top:16px;font-size:14px;line-height:1.5}

</head>
<body><main>
