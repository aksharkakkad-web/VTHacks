<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1420" viewBox="0 0 2000 1420">
  <style>
    .bg{fill:#f7f6f1}.phone{fill:#fff;stroke:#27322f;stroke-width:4}.line{fill:none;stroke:#aeb7b3;stroke-width:3}.soft{fill:#edf0ed;stroke:#aeb7b3;stroke-width:2}.dark{fill:#27322f}.title{font:700 25px system-ui;fill:#17201e}.body{font:16px system-ui;fill:#66716d}.small{font:13px system-ui;fill:#66716d}.label{font:700 20px system-ui;fill:#17201e}.brand{font:700 18px system-ui;fill:#17201e}.btn{font:700 16px system-ui;fill:#fff}.center{text-anchor:middle}.arrow{font:700 28px system-ui;fill:#8b9591}
  </style>
  <rect class="bg" width="2000" height="1420"/>
  <text x="80" y="65" style="font:700 38px system-ui;fill:#17201e">Beacon onboarding — simple wireframes</text>
  <text x="80" y="98" class="body">Welcome → Set home → Preferences → Permissions → App Home</text>
  <g transform="translate(70 145)">
    <text x="190" y="-18" class="label center">1 · Welcome</text>
    <rect class="phone" x="0" y="0" rx="38" width="380" height="610"/><rect class="dark" x="150" y="12" rx="9" width="80" height="16"/>
    <text x="190" y="65" class="brand center">◉ Beacon</text>
    <text x="28" y="125" class="title">Get home with less</text><text x="28" y="155" class="title">to figure out.</text>
    <text x="28" y="190" class="body">Beacon finds a way home that</text><text x="28" y="213" class="body">fits your limits and stays with the trip.</text>
    <rect class="soft" x="28" y="245" rx="16" width="324" height="175"/><text x="190" y="326" class="body center">Campus illustration</text>
    <rect class="line" x="28" y="445" rx="12" width="324" height="70"/><circle class="soft" cx="60" cy="480" r="18"/><text x="92" y="474" class="body">Set it once</text><text x="92" y="497" class="small">One tap later</text>
    <rect class="dark" x="28" y="535" rx="25" width="324" height="50"/><text x="190" y="566" class="btn center">Get started →</text>
  </g>
  <text x="475" y="455" class="arrow center">→</text>
  <g transform="translate(520 145)">
    <text x="190" y="-18" class="label center">2 · Set home</text>
    <rect class="phone" x="0" y="0" rx="38" width="380" height="610"/><rect class="dark" x="150" y="12" rx="9" width="80" height="16"/>
    <text x="28" y="65" class="brand">←</text><text x="190" y="65" class="brand center">◉ Beacon</text>
    <line class="line" x1="28" y1="90" x2="120" y2="90"/><line class="line" x1="130" y1="90" x2="222" y2="90"/><line class="line" x1="232" y1="90" x2="352" y2="90"/>
    <text x="28" y="135" class="title">Where is home?</text><text x="28" y="166" class="body">Save your usual destination.</text>
    <rect class="line" x="28" y="195" rx="12" width="324" height="70"/><text x="48" y="220" class="small">HOME</text><text x="48" y="248" class="brand">Pritchard Hall</text>
    <rect class="soft" x="28" y="285" rx="14" width="324" height="190"/><text x="190" y="372" class="body center">Map + home pin</text>
    <rect class="line" x="28" y="492" rx="25" width="324" height="45"/><text x="190" y="520" class="brand center">Change location</text>
    <rect class="dark" x="28" y="548" rx="25" width="324" height="50"/><text x="190" y="579" class="btn center">Set as home →</text>
  </g>
  <text x="925" y="455" class="arrow center">→</text>
  <g transform="translate(970 145)">
    <text x="190" y="-18" class="label center">3 · Preferences</text>
    <rect class="phone" x="0" y="0" rx="38" width="380" height="610"/><rect class="dark" x="150" y="12" rx="9" width="80" height="16"/>
    <text x="28" y="65" class="brand">←</text><text x="190" y="65" class="brand center">◉ Beacon</text>
    <line class="line" x1="28" y1="90" x2="120" y2="90"/><line class="line" x1="130" y1="90" x2="222" y2="90"/><line class="line" x1="232" y1="90" x2="352" y2="90"/>
    <text x="28" y="135" class="title">Your way home.</text><text x="28" y="166" class="body">Set once. Change anytime.</text>
    <rect class="line" x="28" y="190" rx="12" width="324" height="130"/><text x="48" y="218" class="small">MAXIMUM BUDGET</text><text x="48" y="260" class="title">$10</text><line class="line" x1="48" y1="292" x2="330" y2="292"/><circle class="soft" cx="176" cy="292" r="12"/>
    <rect class="line" x="28" y="338" rx="12" width="324" height="70"/><text x="55" y="380" class="brand">Less walking</text><rect class="soft" x="286" y="359" rx="16" width="48" height="28"/>
    <rect class="line" x="28" y="420" rx="12" width="324" height="70"/><text x="55" y="462" class="brand">Fewer transfers</text><rect class="soft" x="286" y="441" rx="16" width="48" height="28"/>
    <rect class="dark" x="28" y="535" rx="25" width="324" height="50"/><text x="190" y="566" class="btn center">Save preferences →</text>
  </g>
  <text x="1375" y="455" class="arrow center">→</text>
  <g transform="translate(1420 145)">
    <text x="190" y="-18" class="label center">4 · Permissions</text>
    <rect class="phone" x="0" y="0" rx="38" width="380" height="610"/><rect class="dark" x="150" y="12" rx="9" width="80" height="16"/>
    <text x="28" y="65" class="brand">←</text><text x="190" y="65" class="brand center">◉ Beacon</text>
    <line class="line" x1="28" y1="90" x2="120" y2="90"/><line class="line" x1="130" y1="90" x2="222" y2="90"/><line class="line" x1="232" y1="90" x2="352" y2="90"/>
    <text x="28" y="132" class="title">You control what</text><text x="28" y="162" class="title">is shared.</text>
    <text x="28" y="195" class="body">Choose what Beacon may use</text><text x="28" y="218" class="body">during an active trip.</text>
    <rect class="line" x="28" y="240" rx="12" width="324" height="90"/><text x="48" y="268" class="brand">Trip location</text><text x="48" y="293" class="small">Only after plan + provider approval</text><rect class="soft" x="290" y="272" rx="16" width="42" height="25"/>
    <rect class="line" x="28" y="342" rx="12" width="324" height="90"/><text x="48" y="370" class="brand">Trip monitoring</text><text x="48" y="395" class="small">Until I arrive or end the trip</text><rect class="soft" x="290" y="374" rx="16" width="42" height="25"/>
    <rect class="line" x="28" y="444" rx="12" width="324" height="65"/><text x="48" y="483" class="brand">Trusted contact (optional)</text><text x="326" y="483" class="brand">›</text>
    <rect class="dark" x="28" y="535" rx="25" width="324" height="50"/><text x="190" y="566" class="btn center">Save and finish →</text>
  </g>
  <text x="80" y="835" class="label">Supporting states — not extra steps</text>
  <g transform="translate(180 875)">
    <text x="190" y="-18" class="label center">2A · Choose home sheet</text>
    <rect class="phone" x="0" y="0" rx="38" width="380" height="460"/><rect class="soft" x="0" y="100" rx="34" width="380" height="360"/>
    <text x="190" y="140" class="title center">Choose home</text><rect class="line" x="28" y="165" rx="10" width="324" height="48"/><text x="48" y="195" class="body">⌕ Search place or address</text>
    <rect class="line" x="28" y="232" rx="10" width="324" height="62"/><text x="48" y="260" class="brand">Pritchard Hall</text><text x="48" y="282" class="small">Virginia Tech, Blacksburg</text>
    <rect class="line" x="28" y="306" rx="10" width="324" height="62"/><text x="48" y="343" class="brand">Another result</text>
    <rect class="line" x="28" y="380" rx="10" width="324" height="52"/><text x="48" y="412" class="brand">Enter address manually</text>
  </g>
  <g transform="translate(650 875)">
    <text x="190" y="-18" class="label center">4A · Trusted contact sheet</text>
    <rect class="phone" x="0" y="0" rx="38" width="380" height="460"/><text x="28" y="55" class="brand">×</text><text x="190" y="55" class="brand center">◉ Beacon</text>
    <text x="28" y="100" class="title">Add a trusted contact</text><text x="28" y="130" class="body">Optional overdue notifications.</text>
    <rect class="line" x="28" y="158" rx="10" width="324" height="58"/><text x="48" y="182" class="small">NAME</text><text x="48" y="205" class="brand">Maya</text>
    <rect class="line" x="28" y="228" rx="10" width="324" height="58"/><text x="48" y="252" class="small">PHONE</text><text x="48" y="275" class="brand">(540) 555-0142</text>
    <rect class="line" x="28" y="300" rx="10" width="324" height="58"/><text x="48" y="334" class="brand">Overdue alert</text><rect class="soft" x="290" y="317" rx="16" width="42" height="25"/>
    <rect class="dark" x="28" y="382" rx="25" width="324" height="50"/><text x="190" y="413" class="btn center">Save contact</text>
  </g>
  <g transform="translate(1120 875)">
    <text x="190" y="-18" class="label center">Permission unavailable</text>
    <rect class="phone" x="0" y="0" rx="38" width="380" height="460"/><text x="190" y="55" class="brand center">◉ Beacon</text>
    <rect class="soft" x="28" y="85" rx="14" width="324" height="100"/><text x="190" y="140" class="body center">Location illustration</text>
    <text x="28" y="230" class="title">Location is still off.</text><text x="28" y="260" class="body">Finish setup now. Beacon asks again</text><text x="28" y="283" class="body">when a trip needs it.</text>
    <rect class="dark" x="28" y="326" rx="25" width="324" height="50"/><text x="190" y="357" class="btn center">Finish setup</text>
    <rect class="line" x="28" y="390" rx="25" width="324" height="45"/><text x="190" y="418" class="brand center">Open device settings</text>
  </g>
  <text x="80" y="1380" class="body">Excluded: splash · sign-in · Uber/Lyft linking · card entry · provider selection · trip questionnaire · redundant completion screen</text>
</svg>
